name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool targets macOS, but the suite is fixture-driven and fully
        # sandboxed, so it runs anywhere. Linux is the fast default; the macOS
        # job is what would catch a real behavioural difference in the stdlib.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
        # 3.9 is the python3 that macOS itself ships (/usr/bin/python3), so it
        # stays tested. setup-python has no 3.9 build for the image
        # ubuntu-latest moved to (Ubuntu 26.04, November 2026: the job failed
        # at set-up without running a test), so it is pinned to the last image
        # that has one.
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --cov=home_net_audit \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check the tool still starts on its target platform
        run: python home_net_audit.py --help
