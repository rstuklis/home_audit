[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -r a  : report all non-passing outcomes, including xpass, so a fixed bug
#         announces itself instead of quietly flipping colour.
# --strict-markers : a typo'd marker is an error, not a silently ignored one.
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals

markers =
    known_bug: pins behaviour that is currently wrong; xfail(strict) so the test starts failing once the bug is fixed and the marker must be removed.

xfail_strict = true

filterwarnings =
    error
    default::DeprecationWarning
